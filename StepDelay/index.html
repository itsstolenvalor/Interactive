<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#131415">
  <title>StepDelay Interactive Preview</title>
  <meta name="description" content="Explore the StepDelay interface by Stolen Valor.">
  <link rel="stylesheet" href="style.css">
  <script defer src="assets/native.js"></script>
  <script defer src="demo.js"></script>
</head>
<body>
  <main class="demo" aria-label="StepDelay interactive preview">
    <header class="toolbar">
      <p>Interactive preview <span aria-hidden="true">·</span> No audio</p>
      <div class="tools">
        <button type="button" id="size" aria-pressed="false">Enlarge controls</button>
        <button type="button" id="reset">Reset</button>
      </div>
    </header>
    <div class="viewport" id="viewport">
      <div class="instrument" id="instrument" aria-busy="true" inert>
        <img id="poster" src="assets/light-base.webp" width="1600" height="600" alt="StepDelay plug-in interface" draggable="false">
        <canvas id="panel" width="1600" height="600" aria-hidden="true" hidden></canvas>
        <div id="controls" class="controls"></div>
      </div>
    </div>
    <p class="help" id="gesture-help">Drag dials to turn them. Right-click or long-press an intermediate cycle to mute it.</p>
    <p id="status" role="status" class="status" hidden></p>
    <noscript><p class="help">Enable JavaScript to use the preview controls.</p></noscript>
    <div id="popup" class="popup" hidden></div>
    <input id="preset-file" type="file" accept=".stepdelay" hidden>
  </main>
</body>
</html>
